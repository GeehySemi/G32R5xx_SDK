/******************************************************/
/*          G32R501 Debug initialization file         */
/******************************************************/

/*
 * The address 0x08000000 is the starting address where the
 * program executes on the G32R501. If the user modifies
 * the program execution address, please update this address.
 *
 */
SP=_RDWORD(0x08000000)
PC=_RDWORD(0x08000004)

xPSR |= (1 << 24)

LOAD %L INCREMENTAL
