// Define symbols
Define unsigned int SP_PC_UPDATE_SOURCE;
Define unsigned int CUSTOM_VECTOR_ADDR;

Define unsigned int DCS_ZONE1_CSM0;
Define unsigned int DCS_ZONE1_CSM1;
Define unsigned int DCS_ZONE1_CSM2;
Define unsigned int DCS_ZONE1_CSM3;
Define unsigned int DCS_ZONE2_CSM0;
Define unsigned int DCS_ZONE2_CSM1;
Define unsigned int DCS_ZONE2_CSM2;
Define unsigned int DCS_ZONE2_CSM3;

// <<< Use Configuration Wizard in Context Menu >>>

// <h> PC/MSP Update Source
// <i> Select how the debugger obtains initial MSP and PC in Set_SP_PC_Setup().

//   <o0> SP_PC_UPDATE_SOURCE
//      <i> Tool: keil_dbg_tool updates SP/PC after each build from the firmware vector table.
//      <i> Custom: read MSP/PC from CUSTOM_VECTOR_ADDR (ARM layout: offset 0 = MSP, offset 4 = PC).
//      <0=> From build tool (keil_dbg_tool)
//      <1=> Custom vector address
SP_PC_UPDATE_SOURCE = 0;

//   <o> CUSTOM_VECTOR_ADDR <0x0-0xFFFFFFFF:4>
//   <i> Base address of the interrupt vector table in target memory.
//   <i> MSP is loaded from offset 0; PC from offset 4 (Thumb bit cleared for Keil PC register).
//   <i> Typical values (G32R501): CBUS Flash 0x08000000, ITCM RAM 0x00000000.
CUSTOM_VECTOR_ADDR = 0x08000000;

// </h>

// <h> DCS Zone1 CSM
// <i> Zone1 CSM Password
//   <o>  DCS_ZONE1_CSM0 <0x0-0xFFFFFFFF> <i> CSM0 Value
DCS_ZONE1_CSM0 = 0xFFFFFFFF;

//   <o0> DCS_ZONE1_CSM1
//      <i> The location of the zone select block in OTP is decided based on the value of 
//      <i> three 29-bit link pointers programmed in the OTP of each zone.
//      <0xFFFFFFDC=> Zone1 Select Block 0 (Default)
//      <0xFFFDFFBF=> Zone1 Select Block 1
//      <0xFFFFFFFB=> Zone1 Select Block 2
//      <0xFFFDFFF7=> Zone1 Select Block 3
//      <0xFFFEFFF7=> Zone1 Select Block 4
//      <0xFFFFFFF8=> Zone1 Select Block 5
//      <0xFFFFFFF4=> Zone1 Select Block 6
//      <0xFFFEFFFB=> Zone1 Select Block 7
//      <0xFFFEFFEF=> Zone1 Select Block 8
//      <0xFFFFFFF7=> Zone1 Select Block 9
//      <0xFFFEFFDF=> Zone1 Select Block 10
//      <0xFFFFFFC7=> Zone1 Select Block 11
//      <0xFFFFFFD3=> Zone1 Select Block 12
//      <0xFFFEFF7F=> Zone1 Select Block 13
//      <0xFFFFFFF8=> Zone1 Select Block 14
//      <0xFFFEFFF7=> Zone1 Select Block 15
//      <0xFFFDFFF7=> Zone1 Select Block 16
//      <0xFFFFFFFB=> Zone1 Select Block 17
//      <0xFFFDFFBF=> Zone1 Select Block 18
//      <0xFFFFFFDC=> Zone1 Select Block 19
//      <0xFFFFFFDF=> Zone1 Select Block 20
//      <0xFFFEFFBF=> Zone1 Select Block 21
//      <0xFFFFFF7F=> Zone1 Select Block 22
//      <0xFFFFFFD3=> Zone1 Select Block 23
//      <0xFFFFFFC7=> Zone1 Select Block 24
//      <0xFFFEFFDF=> Zone1 Select Block 25
//      <0xFFFFFFF7=> Zone1 Select Block 26
//      <0xFFFEFFEF=> Zone1 Select Block 27
//      <0xFFFEFFFB=> Zone1 Select Block 28
//      <0xFFFFFFF4=> Zone1 Select Block 29
DCS_ZONE1_CSM1 = 0xFFFFFFDC;

//   <o>  DCS_ZONE1_CSM2 <0x0-0xFFFFFFFF> <i> CSM2 Value
DCS_ZONE1_CSM2 = 0xFFFFFFFF;

//   <o>  DCS_ZONE1_CSM3 <0x0-0xFFFFFFFF> <i> CSM3 Value
DCS_ZONE1_CSM3 = 0xFFFFFFFF;

// </h>


// <h> DCS Zone2 CSM
// <i> Zone2 CSM Password
//   <o>  DCS_ZONE2_CSM0 <0x0-0xFFFFFFFF> <i> CSM0 Value
DCS_ZONE2_CSM0 = 0xFFFFFFFF;

//   <o0> DCS_ZONE2_CSM1
//      <i> The location of the zone select block in OTP is decided based on the value of 
//      <i> three 29-bit link pointers programmed in the OTP of each zone.
//      <0xFFFEDFFF=> Zone2 Select Block 0 (Default)
//      <0xFFFFFED7=> Zone2 Select Block 1
//      <0xFFFEFEFF=> Zone2 Select Block 2
//      <0xFFFFFEE7=> Zone2 Select Block 3
//      <0xFFFFFEF3=> Zone2 Select Block 4
//      <0xFFFEFBFF=> Zone2 Select Block 5
//      <0xFFFDFDFF=> Zone2 Select Block 6
//      <0xFFFFFEFF=> Zone2 Select Block 7
//      <0xFFFFFEFC=> Zone2 Select Block 8
//      <0xFFFEFDFF=> Zone2 Select Block 9
//      <0xFFFFFEDB=> Zone2 Select Block 10
//      <0xFFFEEFFF=> Zone2 Select Block 11
//      <0xFFFDEFFF=> Zone2 Select Block 12
//      <0xFFFFFECF=> Zone2 Select Block 13
//      <0xFFFEFBFF=> Zone2 Select Block 14
//      <0xFFFFFEF3=> Zone2 Select Block 15
//      <0xFFFFFEE7=> Zone2 Select Block 16
//      <0xFFFEFEFF=> Zone2 Select Block 17
//      <0xFFFFFED7=> Zone2 Select Block 18
//      <0xFFFEDFFF=> Zone2 Select Block 19
//      <0xFFFEF7FF=> Zone2 Select Block 20
//      <0xFFFFFEBB=> Zone2 Select Block 21
//      <0xFFFFFECF=> Zone2 Select Block 22
//      <0xFFFDEFFF=> Zone2 Select Block 23
//      <0xFFFEEFFF=> Zone2 Select Block 24
//      <0xFFFFFEDB=> Zone2 Select Block 25
//      <0xFFFEFDFF=> Zone2 Select Block 26
//      <0xFFFFFEFC=> Zone2 Select Block 27
//      <0xFFFFFEFF=> Zone2 Select Block 28
//      <0xFFFDFDFF=> Zone2 Select Block 29
DCS_ZONE2_CSM1 = 0xFFFEDFFF;

//   <o>  DCS_ZONE2_CSM2 <0x0-0xFFFFFFFF> <i> CSM2 Value
DCS_ZONE2_CSM2 = 0xFFFFFFFF;

//   <o>  DCS_ZONE2_CSM3 <0x0-0xFFFFFFFF> <i> CSM3 Value
DCS_ZONE2_CSM3 = 0xFFFFFFFF;

// </h>

FUNC void Init_CPU(void)
{
    // Init configuration
    _WDWORD(0xE000ED08, 0x10000000);
    _WDWORD(0xE000ED88, _RDWORD(0xE000ED88) | 0x0C);
    _WBYTE(0x50010600, _RBYTE(0x50010600) & 0xF0);
    _WWORD(0x50026452, _RWORD(0x50026452) | 0x68);
    _WDWORD(0xE0059040, _RDWORD(0xE0059040) | 0x01);
    _WDWORD(0xE0059044, _RDWORD(0xE0059044) | 0x01);
    _WDWORD(0x50020074, 0x01);
    _WWORD(0x500264C0, 0x0001);
    if((_RDWORD(0x50020B00) & 0x01) == 0x01)
    {
        _WDWORD(0x50010830, _RDWORD(0x50010830) | 0xFFFF);
    }

    // Startup configuration
    if((_RDWORD(0x50020B00) & 0x03) == 0x03)
    {
        _WDWORD(0x50010000, 0x00000900);
        _WDWORD(0x50020844, 0x00000000);
        if(((_RDWORD(0x0810B910) & 0xFF000000) >> 24) != 0x5A)
        {
            _WDWORD(0x50020828, 18);
        }
        if(((_RDWORD(0x0810B910) & 0xFF000000) >> 24) == 0x5A)
        {
            _WDWORD(0x50020828, (_RDWORD(0x0810B910) >> 0x08) & 0xFF);
        }
        if((_RDWORD(0x0810B878) & 0xFF03) == 0x5A00)
        {
            _WDWORD(0x500280D4, _RDWORD(0x500280D4) | 0x8000);
        }
        if((_RDWORD(0x0810B894) & 0xFFFF) == 0x5A5A)
        {
            _WDWORD(0x50028024, _RDWORD(0x0810B884));
            _WDWORD(0x50028028, _RDWORD(0x0810B888));
            _WDWORD(0x5002801C, _RDWORD(0x0810B88C));
            _WDWORD(0x50028020, _RDWORD(0x0810B890));
        }
        if(((_RDWORD(0x0810B910) & 0xFF000000) >> 24) == 0x5A)
        {
            _WDWORD(0x50021100, _RDWORD(0x0810B910) & 0xF0000);
            _WDWORD(0x50021104, _RDWORD(0x0810B910) & 0xF0000);
            _WDWORD(0x50020844, _RDWORD(0x0810B910) & 0xFC);
        }
        if(((_RDWORD(0x0810B910) & 0xFF000003) == 0x5A000003) && (_RDWORD(0x5002082C) & 0x01))
        {
            _WDWORD(0x5002081C, _RDWORD(0x5002081C) | 0x02);
        }
    }
    _WDWORD(0x50010000, 0x00000F00);

    // Device configuration
    _WDWORD(0x50020510, _RDWORD(0x0810B800));
    _WDWORD(0x50020514, _RDWORD(0x0810B804));
    _WDWORD(0x50020524, _RDWORD(0x0810B80C));
    _WDWORD(0x5002052C, _RDWORD(0x0810B814));
    _WDWORD(0x50020530, _RDWORD(0x0810B818));
    _WDWORD(0x50020534, _RDWORD(0x0810B81C));
    _WDWORD(0x5002053C, _RDWORD(0x0810B824));
    _WDWORD(0x50020540, _RDWORD(0x0810B828));
    _WDWORD(0x50020544, _RDWORD(0x0810B82C));
    _WDWORD(0x50020548, _RDWORD(0x0810B830));
    _WDWORD(0x5002054C, _RDWORD(0x0810B834));
    _WDWORD(0x50020558, _RDWORD(0x0810B840));
    _WDWORD(0x5002055C, _RDWORD(0x0810B844));
    _WDWORD(0x50020564, _RDWORD(0x0810B84C));
    _WDWORD(0x50020568, _RDWORD(0x0810B850));
    _WDWORD(0x50020570, _RDWORD(0x0810B858));
    _WDWORD(0x50020574, _RDWORD(0x0810B860));
    _WDWORD(0x50020578, _RDWORD(0x0810B864));
    _WDWORD(0x5002057C, _RDWORD(0x0810B868));
    _WDWORD(0x50020580, _RDWORD(0x0810B86C));
    _WDWORD(0x50020584, _RDWORD(0x0810B870));
    if(((_RDWORD(0x0810B914) & 0xFF000000) >> 24) == 0x5A)
    {
        _WDWORD(0x5002075C, _RDWORD(0x0810B914));
    }

    // System init
    _WDWORD(0x20307F30, _RDWORD(0x50010604));
    _WDWORD(0x20307F34, _RDWORD(0x50010650));
    _WDWORD(0x20307F28, _RDWORD(0x50010608));
    _WDWORD(0x20307F2C, _RDWORD(0x50010654));

    if(((_RDWORD(0x50024014) & 0xFF000000) >> 24) == 0x5A)
    {
        if(((_RDWORD(0x50024014) & 0x00000030) >> 4) == 0x0)
        {
            // Configure GPIO24 for Error Status Pin
            // Write to GPAMUX2
            _WDWORD(0x40030010, _RDWORD(0x40030010) & (~(0x03 << 16)));
            _WDWORD(0x40030010, _RDWORD(0x40030010) | (0x01 << 16));
            // Write to GPAGMUX2
            _WDWORD(0x40030044, _RDWORD(0x40030044) & (~(0x03 << 16)));
            _WDWORD(0x40030044, _RDWORD(0x40030044) | (0x03 << 16));
            // Lock GPIO24
            _WDWORD(0x40030078, _RDWORD(0x40030078) | (0x01 << 24));
        }
        else if(((_RDWORD(0x50024014) & 0x00000030) >> 4) == 0x1)
        {
            // Configure GPIO28 for Error Status Pin
            // Write to GPAMUX2
            _WDWORD(0x40030010, _RDWORD(0x40030010) & (~(0x03 << 24)));
            _WDWORD(0x40030010, _RDWORD(0x40030010) | (0x01 << 24));
            // Write to GPAGMUX2
            _WDWORD(0x40030044, _RDWORD(0x40030044) & (~(0x03 << 24)));
            _WDWORD(0x40030044, _RDWORD(0x40030044) | (0x03 << 24));
            // Lock GPIO28
            _WDWORD(0x40030078, _RDWORD(0x40030078) | (0x01 << 28));
        }
        else if(((_RDWORD(0x50024014) & 0x00000030) >> 4) == 0x2)
        {
            // Configure GPIO29 for Error Status Pin
            // Write to GPAMUX2
            _WDWORD(0x40030010, _RDWORD(0x40030010) & (~(0x03 << 26)));
            _WDWORD(0x40030010, _RDWORD(0x40030010) | (0x01 << 26));
            // Write to GPAGMUX2
            _WDWORD(0x40030044, _RDWORD(0x40030044) & (~(0x03 << 26)));
            _WDWORD(0x40030044, _RDWORD(0x40030044) | (0x03 << 26));
            // Lock GPIO29
            _WDWORD(0x40030078, _RDWORD(0x40030078) | (0x01 << 29));
        }
    }

    if((_RDWORD(0x0810B914) & 0xFF) == 0x00)
    {
        _WDWORD(0x40030018, 0xFFCFFFFF);
        _WDWORD(0x40030098, 0x0F6001FF);
    }
    if((_RDWORD(0x0810B914) & 0xFF) == 0x01)
    {
        _WDWORD(0x40030018, 0xFFCFFFFF);
        _WDWORD(0x40030098, 0x00607FFF);
    }
    if((_RDWORD(0x0810B914) & 0xFF) == 0x02)
    {
        _WDWORD(0x40030018, 0x31CF3FFF);
        _WDWORD(0x40030098, 0x0000007B);
    }
    if((_RDWORD(0x0810B914) & 0xFF) == 0x03)
    {
        _WDWORD(0x40030018, 0x31CF3BFF);
        _WDWORD(0x40030098, 0x0000007B);
    }
    if((_RDWORD(0x0810B914) & 0xFF) == 0x04)
    {
        _WDWORD(0x40030018, 0x310D30FF);
        _WDWORD(0x40030098, 0x0000007B);
    }

    if((_RDWORD(0x50020B00) & 0x03) == 0x03)
    {
        _WDWORD(0x5002081C, _RDWORD(0x5002081C) | 0x02);
        _WDWORD(0x50020828, 0x00);
        _WDWORD(0x50020844, 0x00);
    }

    if((_RDWORD(0x0810B898) & 0xFFFF) == 0x5A5A)
    {
        _WDWORD(0x5002800C, _RDWORD(0x0810B89C));
        _WDWORD(0x50028000, _RDWORD(0x0810B8A0));
        _WDWORD(0x50028004, _RDWORD(0x0810B8A4));
    }

    if((_RDWORD(0x0810BA00) & 0xFFFF) == 0xA5A5)
    {
        _WDWORD(0x5002800C, _RDWORD(0x0810BA04));
        _WDWORD(0x50028000, _RDWORD(0x0810BA08));
        _WDWORD(0x50028004, _RDWORD(0x0810BA0C));
    }

    _WDWORD(0x50020A78, _RDWORD(0x50020A78) | 0x0F);
    _WDWORD(0x50028010, _RDWORD(0x0810BA5C));
    _WDWORD(0x50028014, _RDWORD(0x0810BA60));
    _WDWORD(0x50028018, _RDWORD(0x0810BA64));
    _WDWORD(0x50028068, _RDWORD(0x0810BA68));
    _WDWORD(0x5002806C, _RDWORD(0x0810BA6C));
    _WDWORD(0x50028070, _RDWORD(0x0810BA70));
    _WDWORD(0x4002007C, _RDWORD(0x0810BA10));
    _WDWORD(0x4002047C, _RDWORD(0x0810BA14));
    _WDWORD(0x4002087C, _RDWORD(0x0810BA18));
    _WWORD(0x40020076, _RWORD(0x0810BA1C));
    _WWORD(0x40020476, _RWORD(0x0810BA20));
    _WWORD(0x40020876, _RWORD(0x0810BA24));
    _WDWORD(0x400200E0, _RDWORD(0x0810BA28));
    _WDWORD(0x400200E4, _RDWORD(0x0810BA2C));
    _WDWORD(0x400200E8, _RDWORD(0x0810BA30));
    _WDWORD(0x400204E0, _RDWORD(0x0810BA34));
    _WDWORD(0x400204E4, _RDWORD(0x0810BA38));
    _WDWORD(0x400204E8, _RDWORD(0x0810BA3C));
    _WDWORD(0x400208E0, _RDWORD(0x0810BA40));
    _WDWORD(0x400208E4, _RDWORD(0x0810BA44));

    _WDWORD(0x50020A84, _RDWORD(0x50020A84) | 0x00030000);
    _WDWORD(0x5000180C, (_RDWORD(0x5000180C)&0xFF00) | (_RDWORD(0x0810BA50)&0xFF));
    _WDWORD(0x50001C0C, (_RDWORD(0x50001C0C)&0xFF00) | (_RDWORD(0x0810BA54)&0xFF));

    _WDWORD(0x50020B00, _RDWORD(0x50020B00) & (~(0x03 << 0)));

    // Disable and clear all NVIC interrupts
    _WDWORD(0xE000E180, 0xFFFFFFFF);
    _WDWORD(0xE000E184, 0xFFFFFFFF);
    _WDWORD(0xE000E188, 0xFFFFFFFF);
    _WDWORD(0xE000E18C, 0xFFFFFFFF);
    _WDWORD(0xE000E190, 0xFFFFFFFF);
    _WDWORD(0xE000E194, 0xFFFFFFFF);
    _WDWORD(0xE000E198, 0xFFFFFFFF);
    _WDWORD(0xE000E19C, 0xFFFFFFFF);
    _WDWORD(0xE000E1A0, 0xFFFFFFFF);
    _WDWORD(0xE000E1A4, 0xFFFFFFFF);
    _WDWORD(0xE000E1A8, 0xFFFFFFFF);
    _WDWORD(0xE000E1AC, 0xFFFFFFFF);
    _WDWORD(0xE000E1B0, 0xFFFFFFFF);
    _WDWORD(0xE000E1B4, 0xFFFFFFFF);
    _WDWORD(0xE000E1B8, 0xFFFFFFFF);
    _WDWORD(0xE000E1BC, 0xFFFFFFFF);
    _WDWORD(0xE000E280, 0xFFFFFFFF);
    _WDWORD(0xE000E284, 0xFFFFFFFF);
    _WDWORD(0xE000E288, 0xFFFFFFFF);
    _WDWORD(0xE000E28C, 0xFFFFFFFF);
    _WDWORD(0xE000E290, 0xFFFFFFFF);
    _WDWORD(0xE000E294, 0xFFFFFFFF);
    _WDWORD(0xE000E298, 0xFFFFFFFF);
    _WDWORD(0xE000E29C, 0xFFFFFFFF);
    _WDWORD(0xE000E2A0, 0xFFFFFFFF);
    _WDWORD(0xE000E2A4, 0xFFFFFFFF);
    _WDWORD(0xE000E2A8, 0xFFFFFFFF);
    _WDWORD(0xE000E2AC, 0xFFFFFFFF);
    _WDWORD(0xE000E2B0, 0xFFFFFFFF);
    _WDWORD(0xE000E2B4, 0xFFFFFFFF);
    _WDWORD(0xE000E2B8, 0xFFFFFFFF);
    _WDWORD(0xE000E2BC, 0xFFFFFFFF);

    _WDWORD(0x50020000, 0xA5FFFFFF);
}

FUNC void DCS_KEY_Setup(void)
{
    // DCS Zone1 CSM
    _WDWORD(0x50024020, DCS_ZONE1_CSM0);
    _WDWORD(0x50024024, DCS_ZONE1_CSM1);
    _WDWORD(0x50024028, DCS_ZONE1_CSM2);
    _WDWORD(0x5002402C, DCS_ZONE1_CSM3);

    // DCS Zone2 CSM
    _WDWORD(0x500240A0, DCS_ZONE2_CSM0);
    _WDWORD(0x500240A4, DCS_ZONE2_CSM1);
    _WDWORD(0x500240A8, DCS_ZONE2_CSM2);
    _WDWORD(0x500240AC, DCS_ZONE2_CSM3);
}

FUNC void Set_SP_PC_Setup(void) {
    if (SP_PC_UPDATE_SOURCE == 0) {
        // Tool-maintained block: keil_dbg_tool updates the two lines below.
        SP= 0x20004000;
        PC= 0x08000C2C;
    } else {
        SP= _RDWORD(CUSTOM_VECTOR_ADDR);
        PC= _RDWORD(CUSTOM_VECTOR_ADDR + 4) - 1;
    }
    xPSR |= (1 << 24);
}

FUNC void Setup(void) {
    Init_CPU();
    Set_SP_PC_Setup();
}

FUNC void OnResetExec (void) {   // Executes upon software RESET
    DCS_KEY_Setup();
    Setup();                     // Setup for running
}

DCS_KEY_Setup();

LOAD %L INCREMENTAL

Setup();

